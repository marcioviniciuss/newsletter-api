spring:
  datasource:
    url: jdbc:postgresql://ep-royal-snow-ac03hbhr-pooler.sa-east-1.aws.neon.tech/news?sslmode=require&channelBinding=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

newsletter:
  mail:
    sender-email: ${MAIL_SENDER:vmarcio469@gmail.com}
    sender-name: "NewsNews"
newsapi:
  key: ${API_KEY}